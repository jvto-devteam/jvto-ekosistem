name: Sync Google Reviews

on:
  schedule:
    - cron: '0 1 * * *' # Daily 01:00 UTC = 08:00 WIB — same cadence as jvto-web's legacy sync-google-reviews.yml
  workflow_dispatch:

concurrency:
  group: google-reviews-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync Google reviews + aggregate rating
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run reviews sync
        env:
          GBP_CLIENT_ID: ${{ secrets.GBP_CLIENT_ID }}
          GBP_CLIENT_SECRET: ${{ secrets.GBP_CLIENT_SECRET }}
          GBP_REFRESH_TOKEN: ${{ secrets.GBP_REFRESH_TOKEN }}
          GBP_ACCOUNT_ID: ${{ secrets.GBP_ACCOUNT_ID }}
          GBP_LOCATION_ID: ${{ secrets.GBP_LOCATION_ID }}
        run: npm run sync:google-reviews

      # sync:google-reviews returns early with no file writes when it finds zero new
      # reviews / no rating change — but render:web-content unconditionally stamps a
      # fresh generated_at timestamp into all 219 output files on every run, which
      # would otherwise make git status non-empty (and this whole workflow commit +
      # push + trigger a full deploy-vps.yml ISR cache purge) every single night for
      # nothing. Gate the regenerate/validate/commit steps on the sync step having
      # actually changed one of the two raw source files it writes to.
      - name: Check for review data changes
        id: check-changes
        run: |
          set -euo pipefail
          if git status --porcelain -- \
            1-knowledge-and-evidence-core/credentials-and-public-evidence/reviews.json \
            1-knowledge-and-evidence-core/credentials-and-public-evidence/review-platforms.json \
            | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Regenerate schema (rating + review)
        if: steps.check-changes.outputs.changed == 'true'
        run: npm run render:web-content

      - name: Validate schema
        if: steps.check-changes.outputs.changed == 'true'
        run: npm run validate:schema

      - name: Commit and push if changed
        if: steps.check-changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "jvto-ekosistem-bot"
          git config user.email "actions@users.noreply.github.com"
          if git status --porcelain | grep -q .; then
            git add \
              1-knowledge-and-evidence-core/credentials-and-public-evidence/reviews.json \
              1-knowledge-and-evidence-core/credentials-and-public-evidence/review-platforms.json \
              5-experience-engine/json-ld/pages/why-jvto__reviews.schema-output.json \
              5-experience-engine/json-ld/pages/why-jvto__reviews__*.schema-output.json \
              5-experience-engine/manifests/route-output-index.json
            git commit -m "chore(reviews): sync Google reviews + rating + review schema $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          else
            echo "No changes to commit."
          fi
