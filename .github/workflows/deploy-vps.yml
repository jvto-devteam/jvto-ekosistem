name: Deploy JVTO Ecosystem

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'archive/booking-overview-snapshot/**'
      - 'archive/customer-portal-detail-snapshot/**'
      - '3-booking-and-journey-core/**'
      - '4-operations-core/**'
      - '2-product-and-commercial-core/routes-and-itineraries/customer-portal-itinerary-records.json'
      - '5-experience-engine/guest-portal/customer-portal-detail-records.json'
      - '5-experience-engine/guest-portal/guest-portal-records.json'
      - '5-experience-engine/knowledge-feed/customer-portal-faq-packing-feed.json'
      # Every hasChanges booking-sync run regenerates all 17 PDP schema-output
      # files with a fresh generated_at even when no product-contract field
      # actually changed (accepted tradeoff, see generate-tourist-trip-schema.mjs) —
      # without paths-ignore this timestamp-only diff triggers a full deploy
      # (npm ci, cms:audit, Tina build, full rsync) able to cancel a legitimate
      # in-flight deploy via concurrency:cancel-in-progress. Same class of fix as
      # d64c81a for the review-schema sibling case.
      - '5-experience-engine/json-ld/pages/tours__*.schema-output.json'
      # route-output-index.json gets the same unconditional fresh generated_at
      # stamp on every generator run (tourist-trip, review-schema, and the CMS
      # render pipeline all rewrite it), so it carries the identical
      # timestamp-only-diff problem as the PDP files above. Safe to ignore here:
      # it is never the sole source of truth — render-web-content-sources.mjs
      # fully rewrites it from scratch on every real deploy (before merging in
      # PDP/review routes), so nothing is lost by not deploying on a commit that
      # only bumps its timestamp. schema-types-index.json is deliberately NOT
      # listed here: it carries no generated_at/timestamp field at all, so it
      # only appears in a diff when a route's real title/schemaTypes/pages entry
      # actually changes — exactly the case this gate must still catch.
      - '5-experience-engine/manifests/route-output-index.json'
      # The llm-wiki sync commits a raw upstream snapshot plus the composed
      # trust-claims.json nightly. Neither is read by render-web-content-sources
      # nor shipped to the VPS, so a sync commit has nothing to deploy — but
      # without these two entries it would trigger a full deploy (npm ci,
      # cms:audit, Tina build, full rsync) able to cancel a legitimate in-flight
      # deploy via concurrency:cancel-in-progress. Same class of fix as the PDP
      # schema-output case above.
      - 'archive/llm-wiki-snapshot/**'
      - '1-knowledge-and-evidence-core/credentials-and-public-evidence/trust-claims.json'
  workflow_dispatch:

concurrency:
  group: jvto-ekosistem-deploy
  cancel-in-progress: true

jobs:
  validate-build-deploy:
    name: Validate, render, build, and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DEPLOY_PATH: /var/www/jvto-ekosistem
      PM2_APP_NAME: jvto-ekosistem
      APP_PORT: 4178

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Classify deployment mode
        id: deploy-mode
        run: |
          set -euo pipefail

          FULL_DEPLOY=false
          REASON="CMS source/output-only change"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            FULL_DEPLOY=true
            REASON="manual workflow dispatch"
          elif ! git rev-parse HEAD^ >/dev/null 2>&1; then
            FULL_DEPLOY=true
            REASON="no parent commit available"
          else
            CHANGED_FILES="$(git diff --name-only HEAD^ HEAD)"
            echo "Changed files:"
            printf '%s\n' "$CHANGED_FILES"

            while IFS= read -r file; do
              case "$file" in
                "")
                  ;;
                1-knowledge-and-evidence-core/travel-guide/*.source.json|1-knowledge-and-evidence-core/why-jvto/*.source.json|1-knowledge-and-evidence-core/policies/*.source.json|1-knowledge-and-evidence-core/markets/*.source.json|1-knowledge-and-evidence-core/blog/*.source.json|1-knowledge-and-evidence-core/credentials-and-public-evidence/verify-jvto-pages/*.source.json|1-knowledge-and-evidence-core/destinations/*.source.json|1-knowledge-and-evidence-core/contact/*.source.json|1-knowledge-and-evidence-core/isic/*.source.json|1-knowledge-and-evidence-core/tours/*.source.json|1-knowledge-and-evidence-core/home/*.source.json|5-experience-engine/public-website/*|5-experience-engine/public-website/**|5-experience-engine/json-ld/*|5-experience-engine/json-ld/**|5-experience-engine/manifests/*|5-experience-engine/knowledge-feed/*)
                  ;;
                # llm-wiki sync output. Mirrors the paths-ignore entries above:
                # neither the raw upstream snapshot nor the composed
                # trust-claims.json is read by the render pipeline or shipped to
                # the VPS, so a sync commit that reaches this classifier (via a
                # manual dispatch, or bundled with a real change) must not on its
                # own escalate to a full deploy.
                archive/llm-wiki-snapshot/*|archive/llm-wiki-snapshot/**|1-knowledge-and-evidence-core/credentials-and-public-evidence/trust-claims.json)
                  ;;
                *)
                  FULL_DEPLOY=true
                  REASON="non-CMS-output file changed: $file"
                  break
                  ;;
              esac
            done < <(printf '%s\n' "$CHANGED_FILES")
          fi

          echo "full=$FULL_DEPLOY" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"
          echo "Deployment mode: $([ "$FULL_DEPLOY" = true ] && echo full || echo fast) ($REASON)"

      - name: Install dependencies
        if: steps.deploy-mode.outputs.full == 'true'
        run: npm ci

      - name: Audit Tina CMS content
        if: steps.deploy-mode.outputs.full == 'true'
        run: npm run cms:audit -- --verbose

      - name: Validate CMS source JSON
        if: steps.deploy-mode.outputs.full != 'true'
        run: |
          set -euo pipefail
          find \
            1-knowledge-and-evidence-core/travel-guide \
            1-knowledge-and-evidence-core/why-jvto \
            1-knowledge-and-evidence-core/policies \
            1-knowledge-and-evidence-core/markets \
            1-knowledge-and-evidence-core/blog \
            1-knowledge-and-evidence-core/credentials-and-public-evidence/verify-jvto-pages \
            1-knowledge-and-evidence-core/destinations \
            1-knowledge-and-evidence-core/contact \
            1-knowledge-and-evidence-core/isic \
            1-knowledge-and-evidence-core/tours \
            1-knowledge-and-evidence-core/home \
            -name '*.source.json' -print0 \
            | xargs -0 -n1 node -e "const fs=require('node:fs'); JSON.parse(fs.readFileSync(process.argv[1], 'utf8')); console.log('JSON OK:', process.argv[1]);"

      - name: Run schema generator tests
        run: npm run test:review-schema && npm run test:schema

      - name: Render website outputs
        run: npm run render:web-content

      - name: Validate TinaCloud secrets
        if: steps.deploy-mode.outputs.full == 'true'
        env:
          NEXT_PUBLIC_TINA_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_TINA_CLIENT_ID }}
          TINA_TOKEN: ${{ secrets.TINA_TOKEN }}
        run: |
          if [ -z "$NEXT_PUBLIC_TINA_CLIENT_ID" ] || [ -z "$TINA_TOKEN" ]; then
            echo "Missing NEXT_PUBLIC_TINA_CLIENT_ID or TINA_TOKEN secret."
            exit 1
          fi

      - name: Build Tina admin
        if: steps.deploy-mode.outputs.full == 'true'
        env:
          NEXT_PUBLIC_TINA_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_TINA_CLIENT_ID }}
          NEXT_PUBLIC_TINA_BRANCH: main
          TINA_TOKEN: ${{ secrets.TINA_TOKEN }}
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run cms:build

      - name: Verify generated route count
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const index = JSON.parse(fs.readFileSync('5-experience-engine/manifests/route-output-index.json', 'utf8'));
          const reviewRouteRe = /^\/why-jvto\/reviews\/\d+$/;
          const pdpRouteRe = /^\/tours\/(from-bali|from-surabaya)\//;
          const reviewRoutes = index.routes.filter((r) => reviewRouteRe.test(r.route));
          const pdpRoutes = index.routes.filter((r) => pdpRouteRe.test(r.route));
          const contentRoutes = index.routes.filter(
            (r) => !reviewRouteRe.test(r.route) && !pdpRouteRe.test(r.route),
          );

          // 51 since 2026-08-21: /trust was retired (owner decision). It restated
          // /verify-jvto's claims and evidence on a second surface that had to be
          // kept in sync, and had gone 84 days without an inbound link.
          if (contentRoutes.length !== 51) {
            throw new Error(`Expected 51 live-aligned CMS routes, got ${contentRoutes.length}`);
          }

          const reviews = JSON.parse(
            fs.readFileSync(
              '1-knowledge-and-evidence-core/credentials-and-public-evidence/reviews.json',
              'utf8',
            ),
          );
          const expectedReviewRoutes = (reviews.reviews ?? []).length;
          if (reviewRoutes.length !== expectedReviewRoutes) {
            throw new Error(
              `Expected ${expectedReviewRoutes} review detail routes (1 per reviews.json record), got ${reviewRoutes.length}`,
            );
          }

          const expectedPdpRoutes = fs
            .readdirSync('2-product-and-commercial-core/tour-products')
            .filter((f) => f.endsWith('.product-contract.json')).length;
          if (pdpRoutes.length !== expectedPdpRoutes) {
            throw new Error(
              `Expected ${expectedPdpRoutes} tour PDP routes (1 per product-contract.json), got ${pdpRoutes.length}`,
            );
          }

          console.log(`Route count OK: ${contentRoutes.length} CMS routes + ${reviewRoutes.length} review detail routes + ${pdpRoutes.length} tour PDP routes`);
          NODE

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          if [ -z "$VPS_SSH_KEY" ] || [ -z "$VPS_HOST" ]; then
            echo "Missing VPS_SSH_KEY or VPS_HOST secret."
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/jvto-ekosistem
          chmod 600 ~/.ssh/jvto-ekosistem

      - name: Deploy full project to VPS
        if: steps.deploy-mode.outputs.full == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          USERNAME="${VPS_USER:-root}"
          PORT="${VPS_PORT:-22}"
          SSH_OPTS="-i ~/.ssh/jvto-ekosistem -p ${PORT} -o StrictHostKeyChecking=accept-new"

          ssh $SSH_OPTS "$USERNAME@$VPS_HOST" "mkdir -p '$DEPLOY_PATH'"
          rsync -az --delete \
            -e "ssh $SSH_OPTS" \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'node_modules/' \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude '.deploy-package-lock.sha256' \
            --exclude 'public/uploads/' \
            ./ "$USERNAME@$VPS_HOST:$DEPLOY_PATH/"

      - name: Deploy rendered content to VPS
        if: steps.deploy-mode.outputs.full != 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          USERNAME="${VPS_USER:-root}"
          PORT="${VPS_PORT:-22}"
          SSH_OPTS="-i ~/.ssh/jvto-ekosistem -p ${PORT} -o StrictHostKeyChecking=accept-new"

          ssh $SSH_OPTS "$USERNAME@$VPS_HOST" "mkdir -p \
            '$DEPLOY_PATH/1-knowledge-and-evidence-core/travel-guide' \
            '$DEPLOY_PATH/1-knowledge-and-evidence-core/why-jvto' \
            '$DEPLOY_PATH/1-knowledge-and-evidence-core/policies' \
            '$DEPLOY_PATH/1-knowledge-and-evidence-core/markets' \
            '$DEPLOY_PATH/1-knowledge-and-evidence-core/blog' \
            '$DEPLOY_PATH/1-knowledge-and-evidence-core/credentials-and-public-evidence/verify-jvto-pages' \
            '$DEPLOY_PATH/1-knowledge-and-evidence-core/destinations' \
            '$DEPLOY_PATH/1-knowledge-and-evidence-core/contact' \
            '$DEPLOY_PATH/1-knowledge-and-evidence-core/isic' \
            '$DEPLOY_PATH/1-knowledge-and-evidence-core/tours' \
            '$DEPLOY_PATH/1-knowledge-and-evidence-core/home' \
            '$DEPLOY_PATH/5-experience-engine/public-website' \
            '$DEPLOY_PATH/5-experience-engine/json-ld' \
            '$DEPLOY_PATH/5-experience-engine/manifests' \
            '$DEPLOY_PATH/5-experience-engine/knowledge-feed'"

          rsync -az --delete -e "ssh $SSH_OPTS" \
            1-knowledge-and-evidence-core/travel-guide/ \
            "$USERNAME@$VPS_HOST:$DEPLOY_PATH/1-knowledge-and-evidence-core/travel-guide/"
          rsync -az --delete -e "ssh $SSH_OPTS" \
            1-knowledge-and-evidence-core/why-jvto/ \
            "$USERNAME@$VPS_HOST:$DEPLOY_PATH/1-knowledge-and-evidence-core/why-jvto/"
          rsync -az --delete -e "ssh $SSH_OPTS" \
            1-knowledge-and-evidence-core/policies/ \
            "$USERNAME@$VPS_HOST:$DEPLOY_PATH/1-knowledge-and-evidence-core/policies/"
          rsync -az --delete -e "ssh $SSH_OPTS" \
            1-knowledge-and-evidence-core/markets/ \
            "$USERNAME@$VPS_HOST:$DEPLOY_PATH/1-knowledge-and-evidence-core/markets/"
          rsync -az --delete -e "ssh $SSH_OPTS" \
            1-knowledge-and-evidence-core/blog/ \
            "$USERNAME@$VPS_HOST:$DEPLOY_PATH/1-knowledge-and-evidence-core/blog/"
          rsync -az --delete -e "ssh $SSH_OPTS" \
            1-knowledge-and-evidence-core/credentials-and-public-evidence/verify-jvto-pages/ \
            "$USERNAME@$VPS_HOST:$DEPLOY_PATH/1-knowledge-and-evidence-core/credentials-and-public-evidence/verify-jvto-pages/"
          rsync -az --delete -e "ssh $SSH_OPTS" \
            1-knowledge-and-evidence-core/destinations/ \
            "$USERNAME@$VPS_HOST:$DEPLOY_PATH/1-knowledge-and-evidence-core/destinations/"
          rsync -az --delete -e "ssh $SSH_OPTS" \
            1-knowledge-and-evidence-core/contact/ \
            "$USERNAME@$VPS_HOST:$DEPLOY_PATH/1-knowledge-and-evidence-core/contact/"
          rsync -az --delete -e "ssh $SSH_OPTS" \
            1-knowledge-and-evidence-core/isic/ \
            "$USERNAME@$VPS_HOST:$DEPLOY_PATH/1-knowledge-and-evidence-core/isic/"
          rsync -az --delete -e "ssh $SSH_OPTS" \
            1-knowledge-and-evidence-core/tours/ \
            "$USERNAME@$VPS_HOST:$DEPLOY_PATH/1-knowledge-and-evidence-core/tours/"
          rsync -az --delete -e "ssh $SSH_OPTS" \
            1-knowledge-and-evidence-core/home/ \
            "$USERNAME@$VPS_HOST:$DEPLOY_PATH/1-knowledge-and-evidence-core/home/"
          rsync -az --delete -e "ssh $SSH_OPTS" \
            5-experience-engine/public-website/ \
            "$USERNAME@$VPS_HOST:$DEPLOY_PATH/5-experience-engine/public-website/"
          rsync -az --delete -e "ssh $SSH_OPTS" \
            5-experience-engine/json-ld/ \
            "$USERNAME@$VPS_HOST:$DEPLOY_PATH/5-experience-engine/json-ld/"
          rsync -az --delete -e "ssh $SSH_OPTS" \
            5-experience-engine/manifests/ \
            "$USERNAME@$VPS_HOST:$DEPLOY_PATH/5-experience-engine/manifests/"
          rsync -az --delete -e "ssh $SSH_OPTS" \
            5-experience-engine/knowledge-feed/ \
            "$USERNAME@$VPS_HOST:$DEPLOY_PATH/5-experience-engine/knowledge-feed/"

      - name: Install production dependencies and restart PM2
        if: steps.deploy-mode.outputs.full == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          USERNAME="${VPS_USER:-root}"
          PORT="${VPS_PORT:-22}"
          SSH_OPTS="-i ~/.ssh/jvto-ekosistem -p ${PORT} -o StrictHostKeyChecking=accept-new"

          ssh $SSH_OPTS "$USERNAME@$VPS_HOST" "
            set -euo pipefail
            cd '$DEPLOY_PATH'
            LOCK_HASH=\$(sha256sum package-lock.json | awk '{print \$1}')
            if [ -d node_modules ] && [ -f .deploy-package-lock.sha256 ] && [ \"\$(cat .deploy-package-lock.sha256)\" = \"\$LOCK_HASH\" ]; then
              echo 'Production dependencies unchanged; skipping npm ci.'
            else
              npm ci --omit=dev
              printf '%s\n' \"\$LOCK_HASH\" > .deploy-package-lock.sha256
            fi
            if pm2 describe '$PM2_APP_NAME' >/dev/null 2>&1; then
              PORT='$APP_PORT' pm2 reload '$PM2_APP_NAME' --update-env
            else
              PORT='$APP_PORT' pm2 start server.mjs --name '$PM2_APP_NAME' --update-env
            fi
            pm2 save
          "

      # jvto-web re-renders pages against this server the moment it is told to
      # revalidate. `pm2 reload` returns before the app is actually listening,
      # so the old order — restart, then immediately revalidate — pointed
      # jvto-web at a server still coming up. On 2026-08-21 that took all 11
      # crew pages to 404: the failed render was cached as notFound() and,
      # because those routes ARE in the revalidation set, every subsequent
      # ekosistem deploy re-triggered the same race instead of healing it.
      # Do not tell a consumer to refresh until we are genuinely serving.
      - name: Wait until the content API is actually serving
        run: |
          set -euo pipefail
          PROBE="https://ekosistem.javavolcano-touroperator.com/api/file?path=1-knowledge-and-evidence-core/people-and-crew/people.json"
          for attempt in $(seq 1 30); do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$PROBE" || echo 000)"
            if [ "$code" = "200" ]; then
              echo "Content API healthy after ${attempt} attempt(s)."
              exit 0
            fi
            echo "attempt ${attempt}: HTTP ${code}; waiting..."
            sleep 5
          done
          echo "Content API did not return 200 within 150s — refusing to trigger revalidation against a server that is not serving."
          exit 1

      - name: Revalidate jvto-web ecosystem cache
        env:
          JVTO_WEB_REVALIDATE_URL: ${{ secrets.JVTO_WEB_REVALIDATE_URL }}
          JVTO_WEB_REVALIDATE_SECRET: ${{ secrets.JVTO_WEB_REVALIDATE_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${JVTO_WEB_REVALIDATE_SECRET:-}" ]; then
            echo "JVTO_WEB_REVALIDATE_SECRET is not configured; skipping jvto-web cache revalidation."
            exit 0
          fi

          REVALIDATE_URL="${JVTO_WEB_REVALIDATE_URL:-https://javavolcano-touroperator.com/api/revalidate/ecosystem-content}"

          node - <<'NODE' > /tmp/jvto-web-revalidate-body.json
          const fs = require('node:fs');
          const index = JSON.parse(fs.readFileSync('5-experience-engine/manifests/route-output-index.json', 'utf8'));
          const routes = [...new Set((index.routes ?? []).map((entry) => entry.route).filter(Boolean))];
          process.stdout.write(JSON.stringify({ routes }));
          NODE

          http_status="$(curl -sS -o /tmp/jvto-web-revalidate-response.json -w '%{http_code}' \
            -X POST "$REVALIDATE_URL" \
            -H "Authorization: Bearer $JVTO_WEB_REVALIDATE_SECRET" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/jvto-web-revalidate-body.json)"

          cat /tmp/jvto-web-revalidate-response.json
          echo

          if [ "$http_status" -lt 200 ] || [ "$http_status" -ge 300 ]; then
            echo "jvto-web cache revalidation failed with HTTP $http_status"
            exit 1
          fi
