name: Sync Booking Data

on:
  repository_dispatch:
    types: [booking-changed]
  schedule:
    - cron: '0 1 * * *'     # 08:00 WIB daily — guaranteed morning check, safety net for repository_dispatch
  workflow_dispatch:

concurrency:
  group: booking-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Fetch, diff, and commit booking data
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run booking-sync tests
        run: npm run test:booking-sync

      - name: Run booking sync
        run: npm run sync:booking

      - name: Commit and push if changed
        run: |
          set -euo pipefail
          git config user.name "jvto-ekosistem-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ -n "$(git status --porcelain -- archive/booking-overview-snapshot archive/customer-portal-detail-snapshot 2-product-and-commercial-core 3-booking-and-journey-core 4-operations-core 5-experience-engine)" ]; then
            git add archive/booking-overview-snapshot archive/customer-portal-detail-snapshot 2-product-and-commercial-core 3-booking-and-journey-core 4-operations-core 5-experience-engine
            git commit -m "chore(booking-sync): sync booking data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git pull --rebase --autostash
            git push
          else
            echo "No changes to commit."
          fi
